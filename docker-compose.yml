services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: listings
      POSTGRES_USER: listings
      POSTGRES_PASSWORD: listings
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - listings-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listings -d listings"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  listings-pg:
